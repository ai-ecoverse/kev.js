name: Publish

# Publishes @ai-ecoverse/kev.js on a v* tag using npm trusted publishing (OIDC): no NPM_TOKEN secret.
# Configure the trusted publisher once on npmjs.com (package settings -> trusted publisher -> this repo/workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, registry-url: https://registry.npmjs.org }
      - run: npm ci
      - run: npm install -g npm@latest        # trusted publishing needs npm >= 11.5.1
      - run: npm run typecheck
      - run: npm run build:lib
      - run: npm publish
